name: Deploy proxy stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: proxy-stack-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_DIR: /opt/proxy-stack/app
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh

          if [[ -n "$DEPLOY_SSH_KEY" ]]; then
            install -m 600 /dev/null ~/.ssh/deploy_key
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          elif [[ -n "$DEPLOY_PASSWORD" ]]; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          else
            echo "::error::Set DEPLOY_SSH_KEY or DEPLOY_PASSWORD in GitHub Secrets"
            exit 1
          fi

          install -m 700 -d .deploy
          cat > .deploy/ssh-command.sh <<'EOF_SSH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${DEPLOY_SSH_KEY:-}" ]]; then
            exec ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$@"
          fi
          export SSHPASS="${DEPLOY_PASSWORD:?}"
          exec sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "$@"
          EOF_SSH
          cat > .deploy/scp-command.sh <<'EOF_SCP'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ -n "${DEPLOY_SSH_KEY:-}" ]]; then
            exec scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "$@"
          fi
          export SSHPASS="${DEPLOY_PASSWORD:?}"
          exec sshpass -e scp -o PreferredAuthentications=password -o PubkeyAuthentication=no "$@"
          EOF_SCP
          chmod 0700 .deploy/ssh-command.sh .deploy/scp-command.sh

          ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        shell: bash
        run: |
          set -euo pipefail
          ./.deploy/ssh-command.sh -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'EOF_REMOTE'
          set -euo pipefail

          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "[deploy] ERROR: root or sudo access is required to prepare /opt/proxy-stack" >&2
            exit 1
          fi

          $SUDO mkdir -p /opt/proxy-stack/app /opt/proxy-stack/data
          $SUDO chown -R "$(id -un):$(id -gn)" /opt/proxy-stack
          EOF_REMOTE

      - name: Bootstrap Docker on remote host
        shell: bash
        run: |
          set -euo pipefail
          ./.deploy/ssh-command.sh -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'EOF_REMOTE'
          set -euo pipefail

          log() {
            printf '[docker-bootstrap] %s\n' "$*"
          }

          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "[docker-bootstrap] ERROR: root or sudo access is required to install Docker" >&2
            exit 1
          fi

          install_fetch_tools() {
            if command -v curl >/dev/null 2>&1 && { [[ -d /etc/ssl/certs ]] || [[ -f /etc/ssl/certs/ca-certificates.crt ]]; }; then
              return
            fi

            log "Installing curl and CA certificates"
            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y ca-certificates curl
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y ca-certificates curl
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y ca-certificates curl
            elif command -v apk >/dev/null 2>&1; then
              $SUDO apk add --no-cache ca-certificates curl
            else
              echo "[docker-bootstrap] ERROR: unsupported package manager; install Docker manually" >&2
              exit 1
            fi
          }

          install_compose_plugin() {
            log "Installing Docker Compose plugin"
            if command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update
              $SUDO apt-get install -y docker-compose-plugin
            elif command -v dnf >/dev/null 2>&1; then
              $SUDO dnf install -y docker-compose-plugin || $SUDO dnf install -y docker-compose
            elif command -v yum >/dev/null 2>&1; then
              $SUDO yum install -y docker-compose-plugin || $SUDO yum install -y docker-compose
            elif command -v apk >/dev/null 2>&1; then
              $SUDO apk add --no-cache docker-cli-compose
            else
              echo "[docker-bootstrap] ERROR: unsupported package manager; install Docker Compose manually" >&2
              exit 1
            fi
          }

          start_docker_service() {
            if command -v systemctl >/dev/null 2>&1; then
              $SUDO systemctl enable --now docker || true
            elif command -v service >/dev/null 2>&1; then
              $SUDO service docker start || true
            fi
          }

          if command -v docker >/dev/null 2>&1 && $SUDO docker compose version >/dev/null 2>&1; then
            start_docker_service
            log "Docker and Docker Compose are already installed"
            $SUDO docker version --format 'Docker {{.Server.Version}}'
            $SUDO docker compose version
            if $SUDO docker info >/dev/null 2>&1; then
              exit 0
            fi
            log "Docker is installed but the daemon is not ready yet; continuing bootstrap"
          fi

          install_fetch_tools

          if ! command -v docker >/dev/null 2>&1; then
            log "Installing Docker Engine"
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            $SUDO sh /tmp/get-docker.sh
            rm -f /tmp/get-docker.sh
          fi

          start_docker_service

          if ! $SUDO docker compose version >/dev/null 2>&1; then
            install_compose_plugin
          fi

          start_docker_service

          $SUDO docker version --format 'Docker {{.Server.Version}}'
          $SUDO docker compose version
          EOF_REMOTE

      - name: Upload application files
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.deploy/' \
            --exclude='data/' \
            --exclude='output/' \
            -e "./.deploy/ssh-command.sh -p $DEPLOY_PORT" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_DIR/"

      - name: Upload server environment
        shell: bash
        run: |
          set -euo pipefail
          install -m 600 /dev/null .deploy.env
          cat > .deploy.env <<'EOF_ENV'
          ${{ secrets.PROXY_STACK_ENV }}
          EOF_ENV
          sed -i 's/\r$//' .deploy.env

          required_env_keys=(
            XUI_ADMIN_USERNAME
            XUI_ADMIN_PASSWORD
            MTG_SECRET
            VLESS_REMARK
            VLESS_CLIENT_EMAIL
          )
          for key in "${required_env_keys[@]}"; do
            if ! grep -Eq "^${key}=.+" .deploy.env; then
              echo "::error::PROXY_STACK_ENV must contain a non-empty ${key}=... line. Paste the full production .env content into the PROXY_STACK_ENV GitHub secret."
              exit 1
            fi
          done

          ./.deploy/scp-command.sh -P "$DEPLOY_PORT" .deploy.env "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_DIR/.env"
          rm -f .deploy.env

      - name: Configure additional public IPs
        shell: bash
        run: |
          set -euo pipefail
          ./.deploy/ssh-command.sh -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'EOF_REMOTE'
          set -euo pipefail
          cd /opt/proxy-stack/app

          log() {
            printf '[public-ip-bootstrap] %s\n' "$*"
          }

          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "[public-ip-bootstrap] ERROR: root or sudo access is required to configure public IPs" >&2
            exit 1
          fi

          env_value() {
            local key="$1"
            local value
            value="$(grep -E "^${key}=" .env | tail -n 1 | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "$value"
          }

          validate_ipv4() {
            local ip="$1"
            local a b c d
            IFS=. read -r a b c d <<< "$ip"
            for octet in "$a" "$b" "$c" "$d"; do
              [[ "$octet" =~ ^[0-9]+$ ]] || return 1
              (( octet >= 0 && octet <= 255 )) || return 1
            done
            [[ -n "$a" && -n "$b" && -n "$c" && -n "$d" ]]
          }

          configured_additional_ips="$(env_value ADDITIONAL_PUBLIC_IPS)"
          configured_additional_ips="${configured_additional_ips//[[:space:]]/}"

          if [[ -z "$configured_additional_ips" ]]; then
            log "No additional public IPs requested"
            exit 0
          fi

          IFS=',' read -r -a requested_ips <<< "$configured_additional_ips"
          valid_ips=()
          for ip in "${requested_ips[@]}"; do
            [[ -n "$ip" ]] || continue
            if ! validate_ipv4 "$ip"; then
              echo "[public-ip-bootstrap] ERROR: invalid IPv4 address in ADDITIONAL_PUBLIC_IPS: $ip" >&2
              exit 1
            fi
            duplicate=false
            for existing_ip in "${valid_ips[@]}"; do
              if [[ "$existing_ip" == "$ip" ]]; then
                duplicate=true
                break
              fi
            done
            if [[ "$duplicate" == "false" ]]; then
              valid_ips+=("$ip")
            fi
          done

          if [[ "${#valid_ips[@]}" -eq 0 ]]; then
            log "No valid additional public IPs requested"
            exit 0
          fi

          public_host_ips="$(IFS=,; printf '%s' "${valid_ips[*]}")"

          default_iface="$(ip -4 route show default 2>/dev/null | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") {print $(i + 1); exit}}')"
          if [[ -z "$default_iface" ]]; then
            echo "[public-ip-bootstrap] ERROR: unable to detect the default IPv4 interface" >&2
            exit 1
          fi

          tmp_script="$(mktemp)"
          cat > "$tmp_script" <<'EOF_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          CONFIG_FILE="/etc/proxy-stack-public-ips.conf"
          if [[ -f "$CONFIG_FILE" ]]; then
            # shellcheck disable=SC1090
            . "$CONFIG_FILE"
          fi

          ADDITIONAL_PUBLIC_IPS="${ADDITIONAL_PUBLIC_IPS:-}"
          PUBLIC_IP_INTERFACE="${PUBLIC_IP_INTERFACE:-}"

          log() {
            printf '[proxy-stack-public-ips] %s\n' "$*"
          }

          if [[ -z "$ADDITIONAL_PUBLIC_IPS" ]]; then
            log "No additional public IPs configured"
            exit 0
          fi

          if [[ -z "$PUBLIC_IP_INTERFACE" ]]; then
            PUBLIC_IP_INTERFACE="$(ip -4 route show default 2>/dev/null | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") {print $(i + 1); exit}}')"
          fi
          if [[ -z "$PUBLIC_IP_INTERFACE" ]]; then
            echo "[proxy-stack-public-ips] ERROR: unable to detect the default IPv4 interface" >&2
            exit 1
          fi

          IFS=',' read -r -a ips <<< "$ADDITIONAL_PUBLIC_IPS"
          for raw_ip in "${ips[@]}"; do
            ip="${raw_ip//[[:space:]]/}"
            [[ -n "$ip" ]] || continue
            if ip -4 addr show | awk '{print $2}' | cut -d/ -f1 | grep -Fxq "$ip"; then
              log "$ip is already assigned"
              continue
            fi
            log "Assigning $ip/32 to $PUBLIC_IP_INTERFACE"
            ip addr add "$ip/32" dev "$PUBLIC_IP_INTERFACE"
          done
          EOF_SCRIPT
          $SUDO install -m 0755 "$tmp_script" /usr/local/sbin/proxy-stack-public-ips
          rm -f "$tmp_script"

          tmp_config="$(mktemp)"
          {
            printf "ADDITIONAL_PUBLIC_IPS='%s'\n" "$public_host_ips"
            printf "PUBLIC_IP_INTERFACE='%s'\n" "$default_iface"
          } > "$tmp_config"
          $SUDO install -m 0644 "$tmp_config" /etc/proxy-stack-public-ips.conf
          rm -f "$tmp_config"

          if command -v systemctl >/dev/null 2>&1; then
            tmp_service="$(mktemp)"
            cat > "$tmp_service" <<'EOF_SERVICE'
          [Unit]
          Description=Proxy Stack additional public IP assignment
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/proxy-stack-public-ips
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF_SERVICE
            $SUDO install -m 0644 "$tmp_service" /etc/systemd/system/proxy-stack-public-ips.service
            rm -f "$tmp_service"
            $SUDO systemctl daemon-reload
            $SUDO systemctl enable --now proxy-stack-public-ips.service
            log "Additional public IP systemd service enabled"
          else
            $SUDO /usr/local/sbin/proxy-stack-public-ips
            log "Additional public IPs applied for current runtime; systemd is unavailable"
          fi
          EOF_REMOTE

      - name: Configure remote firewall
        shell: bash
        run: |
          set -euo pipefail
          ./.deploy/ssh-command.sh -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'EOF_REMOTE'
          set -euo pipefail
          cd /opt/proxy-stack/app

          log() {
            printf '[firewall-bootstrap] %s\n' "$*"
          }

          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "[firewall-bootstrap] ERROR: root or sudo access is required to configure firewall rules" >&2
            exit 1
          fi

          env_value() {
            local key="$1"
            local value
            value="$(grep -E "^${key}=" .env | tail -n 1 | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "$value"
          }

          is_enabled() {
            case "${1,,}" in
              1|true|yes|on) return 0 ;;
              *) return 1 ;;
            esac
          }

          validate_port() {
            local port="$1"
            [[ "$port" =~ ^[0-9]+$ ]] && (( port >= 1 && port <= 65535 ))
          }

          firewall_auto="$(env_value FIREWALL_AUTO_CONFIG)"
          firewall_auto="${firewall_auto:-true}"
          if ! is_enabled "$firewall_auto"; then
            log "Firewall bootstrap disabled by FIREWALL_AUTO_CONFIG"
            exit 0
          fi

          ssh_port="${{ secrets.DEPLOY_PORT || '22' }}"
          vless_port="$(env_value VLESS_PORT)"
          mtg_port="$(env_value MTG_BIND_PORT)"
          panel_port="$(env_value XUI_PANEL_PORT)"
          open_panel_port="$(env_value FIREWALL_OPEN_PANEL_PORT)"

          vless_port="${vless_port:-443}"
          mtg_port="${mtg_port:-8443}"
          panel_port="${panel_port:-20530}"
          open_panel_port="${open_panel_port:-true}"

          requested_ports=("$ssh_port" "$vless_port" "$mtg_port")
          if is_enabled "$open_panel_port"; then
            requested_ports+=("$panel_port")
          fi

          ports=()
          for port in "${requested_ports[@]}"; do
            if ! validate_port "$port"; then
              echo "[firewall-bootstrap] ERROR: invalid TCP port: $port" >&2
              exit 1
            fi
            duplicate=false
            for existing in "${ports[@]}"; do
              if [[ "$existing" == "$port" ]]; then
                duplicate=true
                break
              fi
            done
            if [[ "$duplicate" == "false" ]]; then
              ports+=("$port")
            fi
          done

          log "Required TCP ports: ${ports[*]}"

          managed_firewall_active=false

          if command -v ufw >/dev/null 2>&1; then
            if $SUDO ufw status | grep -qi "Status: active"; then
              managed_firewall_active=true
              log "Configuring active ufw"
              for port in "${ports[@]}"; do
                $SUDO ufw allow "${port}/tcp" >/dev/null
              done
              $SUDO ufw reload >/dev/null || true
            else
              log "ufw is installed but inactive; leaving it disabled"
            fi
          fi

          if command -v firewall-cmd >/dev/null 2>&1; then
            if $SUDO firewall-cmd --state >/dev/null 2>&1; then
              managed_firewall_active=true
              log "Configuring active firewalld"
              for port in "${ports[@]}"; do
                $SUDO firewall-cmd --permanent --add-port="${port}/tcp" >/dev/null
              done
              $SUDO firewall-cmd --reload >/dev/null
            else
              log "firewalld is installed but inactive; leaving it disabled"
            fi
          fi

          if [[ "$managed_firewall_active" == "false" ]] && command -v iptables >/dev/null 2>&1; then
            log "Configuring direct iptables accept rules"
            for port in "${ports[@]}"; do
              if ! $SUDO iptables -C INPUT -p tcp --dport "$port" -j ACCEPT >/dev/null 2>&1; then
                $SUDO iptables -I INPUT -p tcp --dport "$port" -j ACCEPT
              fi
            done

            if command -v netfilter-persistent >/dev/null 2>&1; then
              $SUDO netfilter-persistent save >/dev/null || true
              log "Saved iptables rules with netfilter-persistent"
            elif command -v service >/dev/null 2>&1 && $SUDO service iptables status >/dev/null 2>&1; then
              $SUDO service iptables save >/dev/null || true
              log "Saved iptables rules with service iptables"
            else
              log "Direct iptables rules applied for the current runtime; no persistence helper found"
            fi
          elif [[ "$managed_firewall_active" == "false" ]]; then
            log "No supported active host firewall detected"
          fi
          EOF_REMOTE

      - name: Deploy with Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          ./.deploy/ssh-command.sh -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -se' <<'EOF_REMOTE'
          set -euo pipefail
          cd /opt/proxy-stack/app

          if [[ "$(id -u)" -eq 0 ]]; then
            SUDO=""
          elif command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "[deploy] ERROR: root or sudo access is required to run Docker" >&2
            exit 1
          fi

          $SUDO docker compose --env-file .env config >/dev/null
          $SUDO docker compose --env-file .env pull mtg
          $SUDO docker compose --env-file .env build --pull xui xui-provision
          $SUDO docker compose --env-file .env up -d xui mtg

          $SUDO docker compose --env-file .env run --rm xui-provision
          $SUDO docker compose --env-file .env run --rm xui-provision

          env_value() {
            local key="$1"
            local value
            value="$(grep -E "^${key}=" .env | tail -n 1 | cut -d= -f2- || true)"
            value="${value%$'\r'}"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "$value"
          }

          panel_path="$(env_value XUI_PANEL_WEB_BASE_PATH)"
          panel_port="$(env_value XUI_PANEL_PORT)"
          tls_enabled="$(env_value XUI_PANEL_TLS_ENABLED)"
          vless_port="$(env_value VLESS_PORT)"
          mtg_port="$(env_value MTG_BIND_PORT)"

          panel_path="${panel_path:-/admin/}"
          panel_port="${panel_port:-20530}"
          tls_enabled="${tls_enabled:-true}"
          vless_port="${vless_port:-443}"
          mtg_port="${mtg_port:-8443}"
          [[ "$panel_path" == /* ]] || panel_path="/$panel_path"
          [[ "$panel_path" == */ ]] || panel_path="$panel_path/"
          panel_scheme="http"
          curl_tls_flag=()
          if [[ "$tls_enabled" == "true" ]]; then
            panel_scheme="https"
            curl_tls_flag=(-k)
          fi

          curl "${curl_tls_flag[@]}" -fsS "${panel_scheme}://127.0.0.1:${panel_port}${panel_path}" >/dev/null
          ss -ltn | grep -E "[:.]${vless_port}[[:space:]]" >/dev/null
          ss -ltn | grep -E "[:.]${mtg_port}[[:space:]]" >/dev/null
          $SUDO docker compose --env-file .env ps
          EOF_REMOTE
